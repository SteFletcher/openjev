# Example only: copy to .github/workflows/ in the repo that owns the assistant.
# Blocks a merge when a prompt or model change drops the pass rate or the judge stops agreeing
# with the human labels. Point TYPESAFE_BASE_URL at Jev, Codiv or an OpenJev your runners can reach.
# [snippet:evals-ci]
name: eval-gate
on:
  pull_request:
    paths: ["prompts/**", "assistant/**", "evals/**"]

jobs:
  eval:
    runs-on: ubuntu-latest
    env:
      TYPESAFE_BASE_URL: ${{ vars.TYPESAFE_BASE_URL }}
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install "typesafe-sdk>=0.7"
      - name: Regenerate answers with the changed prompt
        run: python evals/generate_answers.py evals/questions.jsonl > evals/dataset.jsonl
      - name: Judge them, and fail the build below the bar
        run: python evals/run_eval.py evals/dataset.jsonl --out eval-report.json --min-pass 0.9 --min-agreement 0.85
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: eval-report, path: eval-report.json }
# [/snippet]
